<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas</title>
  </head>
  <body>
    <canvas
      id="myCanvas"
      width="600"
      height="600"
      style="border: 1px solid #000"
    ></canvas>

    <canvas
      id="myCanvas2"
      width="600"
      height="600"
      style="border: 1px solid #000"
    ></canvas>
    <script>
      let c = document.getElementById("myCanvas");
      let ctx = c.getContext("2d");

      //pravokutnik
      ctx.beginPath();
      ctx.rect(10, 10, 400, 400);
      ctx.fillStyle = "blue";
      ctx.fill();

      //krug
      ctx.beginPath();
      ctx.arc(200, 300, 100, 0, 2 * Math.PI);
      ctx.fillStyle = "black";
      ctx.stroke();

      ctx.moveTo(100, 200);
      ctx.lineTo(200, 300);
      ctx.lineTo(300, 200);
      ctx.lineTo(100, 200);
      ctx.stroke();

      let c2 = document.getElementById("myCanvas2");
      let ctx2 = c2.getContext("2d");
      ctx2.beginPath();
      ctx2.rect(100, 200, 400, 200);
      ctx2.fillStyle = "blue";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.rect(150, 300, 100, 100);
      ctx2.fillStyle = "grey";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.rect(300, 250, 150, 90);
      ctx2.fillStyle = "grey";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.moveTo(100, 200);
      ctx2.lineTo(500, 200);
      ctx2.lineTo(300, 100);
      ctx2.lineTo(100, 200);
      ctx2.fillStyle = "brown";
      ctx2.fill();
      ctx2.stroke();

      ctx2.beginPath();
      ctx2.rect(550, 250, 20, 150);
      ctx2.fillStyle = "brown";
      ctx2.fill();

      ctx2.beginPath();
      ctx2.arc(560, 210, 40, 0, 2 * Math.PI);
      ctx2.fillStyle = "green";
      ctx2.fill();
    </script>
  </body>
</html>
