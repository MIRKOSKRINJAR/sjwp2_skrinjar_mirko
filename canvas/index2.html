<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: white;
        text-align: center;
      }

      h1 {
        margin-bottom: 30px;
      }

      .zadatak {
        margin-bottom: 50px;
      }

      svg {
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <h1>SVG zadaci</h1>

    <div class="zadatak">
      <h2>Zadatak 1</h2>

      <svg width="600" height="450" viewBox="0 0 600 450">
        <rect x="0" y="0" width="600" height="300" fill="lightblue" />

        <rect x="0" y="300" width="600" height="150" fill="royalblue" />

        <circle cx="500" cy="80" r="50" fill="yellow" />

        <rect x="290" y="100" width="10" height="205" fill="black" />

        <polygon points="290,145 220,270 290,270" fill="white" />

        <polygon points="300,145 300,270 370,270" fill="white" />

        <polygon points="290,110 245,125 290,140" fill="green" />

        <rect x="195" y="270" width="210" height="45" fill="firebrick" />
      </svg>
    </div>

    <div class="zadatak">
      <h2>Zadatak 2</h2>

      <svg width="500" height="500" viewBox="0 0 500 500">
        <circle cx="250" cy="300" r="110" fill="#d1495b" />

        <rect x="220" y="175" width="60" height="30" fill="#f4a261" />

        <circle
          cx="250"
          cy="160"
          r="18"
          fill="white"
          stroke="#f4a261"
          stroke-width="4"
        />
      </svg>
    </div>
    <div class="zadatak">
      <h2>Zadatak 3</h2>

      <svg width="600" height="450" viewBox="0 0 600 450">
        <rect x="0" y="0" width="600" height="450" fill="#f3d8b5" />

        <path
          d="M0 300
                   Q150 260 300 290
                   Q450 260 600 300
                   L600 450
                   L0 450 Z"
          fill="#f5f1e3"
        />

        <polygon points="100,90 55,300 145,300" fill="#28745a" />

        <rect x="93" y="300" width="10" height="55" fill="#777b6c" />

        <polygon points="200,135 170,295 230,295" fill="#28745a" />

        <rect x="196" y="295" width="8" height="45" fill="#777b6c" />

        <polygon points="360,140 330,285 390,285" fill="#28745a" />

        <rect x="356" y="285" width="8" height="40" fill="#777b6c" />

        <polygon points="450,115 410,295 490,295" fill="#28745a" />

        <rect x="446" y="295" width="9" height="50" fill="#777b6c" />
      </svg>
    </div>

    <h1>Zadatak 4</h1>
    <svg width="500" height="500">
      <polygon points="300,250 180,410 420,410" fill="#173c2c" />
      <polygon points="300,160 210,330 390,330" fill="#0f6650" />
      <polygon points="300,90 240,230 360,230" fill="#3f8361" />
      <rect x="278" y="410" width="47" height="45" fill="firebrick" />
    </svg>
    <h1>ZADATAK 5</h1>
    <svg width="700" height="350">
      <circle cx="280" cy="55" r="50" fill="#D0873C" />

      <rect x="230" y="80" width="100" height="120" rx="35" fill="#D0873C" />

      <rect x="185" y="80" width="70" height="55" rx="30" fill="#D0873C" />

      <rect x="305" y="80" width="70" height="55" rx="30" fill="#D0873C" />

      <rect
        x="220"
        y="160"
        width="55"
        height="100"
        rx="30"
        fill="#D0873C"
        transform="rotate(20 247 210)"
      />

      <rect
        x="285"
        y="160"
        width="55"
        height="100"
        rx="30"
        fill="#D0873C"
        transform="rotate(-20 312 210)"
      />

      <circle cx="260" cy="55" r="5" fill="white" />
      <circle cx="300" cy="55" r="5" fill="white" />

      <rect
        x="263"
        y="80"
        width="34"
        height="10"
        rx="5"
        fill="none"
        stroke="white"
        stroke-width="4"
      />

      <circle cx="280" cy="130" r="9" fill="black" />
      <circle cx="280" cy="163" r="9" fill="black" />
    </svg>
    <h1>ZADATAK 6</h1>
    <svg width="700" height="750" viewBox="0 0 700 750">
      <path
        d="
        M 525 373
        A 220 220 0 1 0 515 683
        L 365 520
        Z
    "
        fill="#FFF500"
        stroke="black"
        stroke-width="8"
        stroke-linejoin="miter"
      />
      <circle cx="373" cy="431" r="23" fill="black" />
    </svg>
  </body>
</html>
